limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=addr:10m;

server {
  listen 80;
  server_name _;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(self), microphone=()" always;
  location / { proxy_pass http://frontend:80; proxy_set_header Host $host; }
  location /api/auth/ { limit_req zone=auth_per_ip burst=3 nodelay; proxy_pass http://backend:8000/api/auth/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location /api/ { limit_req zone=api_per_ip burst=40 nodelay; proxy_pass http://backend:8000/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location /ws/ { limit_conn addr 5; proxy_pass http://backend:8000/ws/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; }
}
